"%test":
  quarkus:
    console:
      color: true
    log:
      min-level: TRACE
  oprc:
    log: TRACE
    pm:
      crmEnabled: false
      kafkaEnabled: false
      env: |
        defaultEnv: default
        environments:
          - name: default

"%dev":
  quarkus:
    console:
      color: true
    http:
      port: 8088
  oprc:
    log: DEBUG
    pm:
      crmEnabled: false
      kafkaEnabled: false
      env: |
          defaultEnv: default
          environments:
          - name: default
            crmUrl: http://localhost:8091
            localGatewayUrl: http://localhost:10000
            globalGatewayUrl: http://localhost:10000
  kafka:
    bootstrap:
      servers: localhost:31000


oprc:
  pm:
    clsProvisionTopic: oaas-cls
    kafkaEnabled: true
    crmEnabled: true
    fnProvisionTopic: oaas-fn
    crHashTopic: oaas-cr-hash
  log: INFO
  name: package-manager
  env: |
    OPRC_DB_PKG_HOST=127.0.0.1
    OPRC_DB_PKG_PORT=8529
    OPRC_DB_PKG_USER=root
    OPRC_DB_PKG_DB=oaas


quarkus:
  http:
    access-log:
      enabled: true
      pattern: '"%r" %s %b %{RESPONSE_TIME} ms'
      exclude-pattern: /q/.*
    record-request-start-time: true
  vertx:
    prefer-native-transport: true
  swagger-ui:
    always-include: true
  smallrye-openapi:
    store-schema-directory: ../doc/package-manager
    enable: true
  log:
    category:
      "org.hpcclab.oaas":
        level: ${oprc.log}
  container-image:
    builder: docker
    image: ${ci.registry.image:oaas}/${oprc.name}${tag:}
  micrometer:
    export:
      json:
        enabled: true
        path: jsonmetrics
  native:
    resources:
      includes:
        - builtin/**

  kafka:
    devservices:
      enabled: false
  grpc:
    server:
      enable-reflection-service: true
      use-separate-server: false
mp:
  messaging:
    outgoing:
      fnProvisions:
        enabled: ${oprc.pm.kafkaEnabled}
        connector: smallrye-kafka
        topic: ${oprc.pm.fnProvisionTopic}
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
      clsProvisions:
        enabled: ${oprc.pm.kafkaEnabled}
        connector: smallrye-kafka
        topic: ${oprc.pm.clsProvisionTopic}
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
      crHashs:
        enabled: ${oprc.pm.kafkaEnabled}
        connector: smallrye-kafka
        topic: ${oprc.pm.crHashTopic}
#        value:
#          serializer: io.quarkus.kafka.client.serialization.BufferSerializer

